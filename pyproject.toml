[project]
name = "delivery-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "pytest>=8.0"]  # pytest is a RUNTIME dep: `dos verify` runs card evals with it

[project.scripts]
dos = "delivery_os.cli:main"


[tool.setuptools.package-data]
"delivery_os" = ["templates/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["delivery_os*"]
