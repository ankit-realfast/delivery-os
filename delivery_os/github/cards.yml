name: delivery-os cards
on:
  push:
    paths: ["cards/**", "contract/**", ".delivery-os.yml"]
  pull_request:
    paths: ["cards/**", "contract/**", ".delivery-os.yml"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install
          "delivery-os @ git+https://github.com/ankit-realfast/delivery-os.git@main"
      - run: dos lint
      - run: dos doctor
