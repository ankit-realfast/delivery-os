name: quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q delivery_os
      - run: python -m delivery_os lint
      - run: python -m delivery_os doctor
      - run: python -m delivery_os --json version

  static-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check delivery_os
      - run: ruff format --check delivery_os
      - run: mypy delivery_os
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: dos --version
