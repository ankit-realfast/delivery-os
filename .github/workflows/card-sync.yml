name: card-sync
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    # Defence in depth for C5. The real guard is transition_for's three-valued
    # `event` domain, which is reachable by the test suite; this only stops an
    # abandoned PR from starting the job at all. `closed` fires for merge and
    # for abandonment alike, so the merged flag must be consulted.
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Collect changed card paths
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > changed.txt

      - name: Collect approving reviewers
        id: approvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | join(",")' > approvers.txt
          echo "list=$(cat approvers.txt)" >> "$GITHUB_OUTPUT"

      - name: Advance cards
        env:
          # Three-valued, because `closed` cannot tell merge from abandonment.
          PR_STATE: >-
            ${{ github.event.action == 'closed'
                && (github.event.pull_request.merged && 'merged' || 'abandoned')
                || 'open' }}
        run: |
          python -m delivery_os.cli --root cards sync-pr \
            --changed "$(cat changed.txt)" \
            --approvers "${{ steps.approvers.outputs.list }}" \
            --pr-state "$PR_STATE"

      - name: Commit state changes
        run: |
          git config user.name "card-sync"
          git config user.email "card-sync@users.noreply.github.com"
          git add cards/
          git diff --staged --quiet || git commit -m "chore: advance card states from PR #${{ github.event.pull_request.number }}"
          git push
