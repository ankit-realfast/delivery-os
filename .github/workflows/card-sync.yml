name: card-sync
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ["cards/**"]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delivery-os-card-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: >-
            ${{ github.event.pull_request.merged
                && github.event.pull_request.base.ref
                || github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt

      - name: Collect changed paths and approving reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/delivery-os-changed.txt"
          gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq '[sort_by(.user.login) | group_by(.user.login)[] | sort_by(.submitted_at) | last | select(.state=="APPROVED") | .user.login] | join(",")' \
            > "$RUNNER_TEMP/delivery-os-approvers.txt"

      - name: Advance cards
        env:
          PR_STATE: >-
            ${{ github.event.action == 'closed'
                && (github.event.pull_request.merged && 'merged' || 'abandoned')
                || 'open' }}
        run: |
          python -m delivery_os sync-pr \
            --changed "$(cat "$RUNNER_TEMP/delivery-os-changed.txt")" \
            --approvers "$(cat "$RUNNER_TEMP/delivery-os-approvers.txt")" \
            --pr-state "$PR_STATE" \
            --pr "${{ github.event.pull_request.number }}"

      - name: Commit state changes
        run: |
          git config user.name "delivery-os"
          git config user.email "delivery-os@users.noreply.github.com"
          git add cards/
          git diff --staged --quiet || git commit -m \
            "chore(delivery-os): record PR #${{ github.event.pull_request.number }} state"
          git push
